<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>知乎回答朗读设置</title><link rel="stylesheet" href="options.css"></head><body><main>
<h1>知乎回答朗读</h1>
<section id="browser-settings"><label for="voice">浏览器声音</label><select id="voice"><option value="">自动选择中文声音</option></select><p>可用声音和音质因浏览器和设备而异。</p></section>
<label for="rate">播放速度</label><select id="rate"><option value="0.75">0.75×</option><option value="0.8">0.8×</option><option value="1">1× 正常</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select>
<p>保存后在下一次开始朗读时生效。</p>
<button id="save" type="button">保存设置</button><p id="status" role="status"></p>
</main><script src="options.js"></script></body></html>
